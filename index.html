<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>トレーニング・クエスト：失われた冒険者の世界</title>
<style>
:root{--bg:#07071a;--panel:#12122b;--line:#3d3d8f;--glow:#6a7cff;--purple:#a45cff;--text:#e6e6ff;--dim:#9a9ad0;--gold:#ffd24a;--hp:#e04a5a;--mp:#4a8cff;--exp:#8cff7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#04040d;color:var(--text);font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",monospace;font-size:15px;line-height:1.5;touch-action:manipulation}
button,input,select,textarea{font:inherit}
#app{max-width:620px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);border-left:2px solid #1a1a44;border-right:2px solid #1a1a44;padding-bottom:env(safe-area-inset-bottom)}
#hud{display:none;background:linear-gradient(#1a1a40,#101030);border-bottom:3px solid var(--line);padding:6px 8px}
#hud .r1{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;gap:6px}
#hud .r1 b{color:var(--gold)}
.bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.bar{position:relative;height:14px;background:#05051a;border:2px solid #000;outline:1px solid var(--line)}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .25s}
.bar span{position:absolute;left:0;right:0;top:0;font-size:10px;line-height:10px;text-align:center;text-shadow:1px 1px 0 #000;white-space:nowrap}
.bar.big{height:18px}.bar.big span{font-size:12px;line-height:14px}
#stage{position:relative;background:#000;border-bottom:3px solid var(--line);overflow:hidden}
#cv{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
#fxl,#flash,#banner,#toasts{position:absolute;pointer-events:none}
#fxl,#flash{inset:0}
#flash{opacity:0}
#flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
#stage.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translate(0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
.pop{position:absolute;font-weight:bold;font-size:22px;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;animation:pp 1s ease-out forwards;transform:translateX(-50%)}
.pop.d{color:#fff}.pop.c{color:#ffd24a;font-size:28px}.pop.h{color:#6aff9a}.pop.m{color:#9ac8ff}.pop.x{color:#ff6a6a}.pop.t{color:#ccc;font-size:18px}
@keyframes pp{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-40px}}
#banner{left:0;right:0;top:34%;text-align:center;font-size:26px;font-weight:bold;letter-spacing:2px;text-shadow:3px 3px 0 #000,0 0 14px currentColor;opacity:0}
#banner.go{animation:bn 1.6s ease-out}
@keyframes bn{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#toasts{left:6px;right:6px;top:6px;display:flex;flex-direction:column;gap:4px;align-items:center}
.toast{background:rgba(10,10,40,.92);border:2px solid var(--purple);padding:4px 10px;font-size:13px;animation:ts 2.8s forwards;box-shadow:0 0 10px var(--purple)}
@keyframes ts{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#panel{flex:1;padding:10px;background:linear-gradient(#12122b,#0a0a1e)}
#nav{display:none;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:#0d0d26;border-top:3px solid var(--line)}
.nb{font-size:11px;min-height:44px;padding:2px;color:var(--text);background:#1b1b48;border:2px solid #3a3a90;box-shadow:0 2px 0 #000;cursor:pointer;line-height:1.2}
.nb:active{transform:translateY(2px);box-shadow:none}
h2{margin:0 0 6px;font-size:18px;color:#cdd3ff;text-shadow:0 0 8px var(--glow);border-bottom:2px dashed var(--line);padding-bottom:4px}
h3{margin:10px 0 4px;font-size:15px;color:var(--purple)}
p{margin:4px 0}
.txt{color:var(--text)}.dim{color:var(--dim);font-size:13px}.gold{color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.col{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.btn{color:var(--text);background:linear-gradient(#2e2e72,#1c1c4a);border:2px solid var(--glow);box-shadow:0 3px 0 #000,inset 0 0 0 2px #0c0c34;padding:8px 6px;min-height:46px;cursor:pointer;text-align:center;border-radius:0}
.btn:hover{filter:brightness(1.2)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 #000,inset 0 0 0 2px #0c0c34}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.btn.atk{border-color:#ff6a6a;background:linear-gradient(#6a2030,#3a1020)}
.btn.def{border-color:#6ad0ff;background:linear-gradient(#20507a,#102a4a)}
.btn.skl{border-color:#c48cff;background:linear-gradient(#502a7a,#2a1048)}
.btn.itm{border-color:#6aff9a;background:linear-gradient(#206a40,#103a24)}
.btn.sm{min-height:36px;padding:4px 8px;font-size:13px}
.btn.on{border-color:var(--gold);box-shadow:0 3px 0 #000,0 0 8px var(--gold)}
.box{background:#0c0c26;border:2px solid var(--line);padding:8px;margin:6px 0}
.log{background:#05051a;border:2px solid #2a2a66;padding:6px 8px;min-height:84px;font-size:14px}
.log div{margin:1px 0}.log div:last-child{color:#fff}
.log div:not(:last-child){color:#a8a8d8}
.item{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px dotted #333377;padding:6px 0}
.item .l{flex:1;min-width:0}.item .r{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;font-size:11px;border:1px solid currentColor;padding:0 4px;margin-left:4px}
.tabs{display:flex;gap:4px;margin:6px 0}.tabs .btn{flex:1;min-height:38px;padding:4px}
input[type=text],input[type=number],select,textarea{width:100%;background:#05051a;color:var(--text);border:2px solid var(--glow);padding:8px;border-radius:0}
input[type=range]{width:100%;accent-color:var(--purple)}
label{display:block;margin:6px 0 2px;font-size:13px;color:var(--dim)}
.title-wrap{text-align:center;padding:10px 0}
.gtitle{font-size:26px;line-height:1.3;margin:10px 0 2px;color:#dfe4ff;text-shadow:0 0 6px #6a7cff,0 0 18px #a45cff,3px 3px 0 #000;letter-spacing:2px}
.gsub{font-size:15px;color:#c8a8ff;margin-bottom:12px;text-shadow:0 0 8px #a45cff}
.dlg{background:#0a0a2a;border:3px solid var(--glow);padding:10px;min-height:96px;box-shadow:inset 0 0 0 2px #000}
.dlg .who{color:var(--gold);font-weight:bold;margin-bottom:4px}
.jobc{border:2px solid var(--line);padding:8px;margin:6px 0;cursor:pointer;background:#0c0c26}
.jobc.on{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.dexg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dexc{border:2px solid var(--line);padding:6px;background:#0c0c26;font-size:12px}
.dexc img{width:48px;height:48px;image-rendering:pixelated;float:left;margin-right:6px;background:#05051a;border:1px solid #333}
.dexc.un img{filter:brightness(0)}
#modal{position:fixed;inset:0;background:rgba(0,0,10,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mbox{background:#10102e;border:3px solid var(--purple);box-shadow:0 0 20px var(--purple);padding:14px;max-width:420px;width:100%}
.hl{color:#ffd24a}.rare{color:#5aa8ff}.epic{color:#b46bff}.legend{color:#ffb53a;text-shadow:0 0 6px #ff8a00}.common{color:#cfd0e8}
.ok{color:#6aff9a}.ng{color:#ff7a7a}
@media (min-width:700px){body{font-size:16px}.gtitle{font-size:32px}}
@media (prefers-reduced-motion:reduce){.pop,.toast,#banner.go{animation-duration:.01s}}
</style>
</head>

let S=null;
const needExp=lv=>Math.round(8*Math.pow(lv,1.7));
const MAXLV=30;
function newState(name,job){
  const s={ver:1,name:name||'ユウ',job:job||'sword',lv:1,exp:0,sp:0,hp:1,mp:1,gold:100,
    bonus:{hp:0,mp:0,atk:0,def:0},skills:{},inv:{potion:3,wood_sword:1,cloth:1},
    eq:{weapon:'wood_sword',armor:'cloth',acc:null},enh:{},loc:'town',
    unlocked:{town:true,forest:true},prog:{},astat:{},bossDone:{},dex:{},
    quests:{active:{},done:{}},daily:{date:'',list:[]},
    train:[],rest:{},tclaim:{},ach:{},titles:['見習い冒険者'],title:'見習い冒険者',lore:{},found:{},
    st:{kills:0,chests:0,explores:0,battles:0,bosses:0,flee:0,deaths:0,skillUses:0,itemUses:0,gold:0},
    flags:{},saved:0,created:Date.now()};
  SK.forEach(k=>{if(k.job===s.job&&k.cost===0)s.skills[k.id]=1});
  return s;
}
function merge(d,s){
  if(Array.isArray(d)||typeof d!=='object'||d===null)return (s!==undefined&&typeof s===typeof d)?s:d;
  const o=Object.assign({},d);
  if(typeof s!=='object'||s===null)return o;
  for(const k of Object.keys(s)){
    if(k in d&&!Array.isArray(d[k])&&typeof d[k]==='object'&&d[k]!==null)o[k]=merge(d[k],s[k]);
    else o[k]=s[k];
  }
  return o;
}
function sanitize(){
  const m=stats();
  S.hp=clamp(Math.floor(S.hp)||1,1,m.hp);S.mp=clamp(Math.floor(S.mp)||0,0,m.mp);
  S.lv=clamp(S.lv|0||1,1,MAXLV);S.gold=Math.max(0,S.gold|0);
  if(!AREAS[S.loc]||!S.unlocked[S.loc])S.loc='town';
  S.unlocked.town=true;S.unlocked.forest=true;
  for(const k of Object.keys(S.inv))if(!IT[k]||S.inv[k]<=0)delete S.inv[k];
  for(const sl of ['weapon','armor','acc']){const id=S.eq[sl];if(id&&(!IT[id]||!S.inv[id]))S.eq[sl]=null}
}
function stats(){
  const j=JOBS[S.job],lv=S.lv,g=j.g;
  let hp=j.hp+g.hp*(lv-1)+S.bonus.hp,mp=j.mp+g.mp*(lv-1)+S.bonus.mp,atk=j.atk+g.atk*(lv-1)+S.bonus.atk,def=j.def+g.def*(lv-1)+S.bonus.def,luck=0;
  for(const sl of ['weapon','armor','acc']){
    const it=IT[S.eq[sl]];if(!it)continue;const e=S.enh[it.id]||0;
    if(it.atk)atk+=it.atk+e*(1+Math.floor(it.atk*.1));
    if(it.def)def+=it.def+e*(1+Math.floor(it.def*.1));
    if(it.t!=='acc'&&e&&it.t==='armor')hp+=e*4;
    hp+=it.hp||0;mp+=it.mp||0;luck+=it.luck||0;
  }
  let am=1,dm=1,hm=1,mm=1;
  for(const id of Object.keys(S.skills)){const k=SKM[id];if(!k||k.k!=='pas')continue;am+=k.atk||0;dm+=k.def||0;hm+=k.hpm||0;mm+=k.mpm||0;luck+=k.luck||0}
  return {hp:Math.floor(hp*hm),mp:Math.floor(mp*mm),atk:Math.floor(atk*am),def:Math.floor(def*dm),luck};
}
function gainExp(n){
  const lines=[];if(n<=0)return lines;
  S.exp+=n;
  while(S.lv<MAXLV&&S.exp>=needExp(S.lv)){
    S.exp-=needExp(S.lv);
    const b=stats();S.lv++;S.sp++;
    const a=stats();
    S.hp=Math.min(a.hp,S.hp+Math.floor(a.hp*.3)+(a.hp-b.hp));S.mp=Math.min(a.mp,S.mp+Math.floor(a.mp*.3)+(a.mp-b.mp));
    lines.push(`<span class="hl">★レベルアップ！ Lv${S.lv}</span> HP+${a.hp-b.hp} MP+${a.mp-b.mp} ATK+${a.atk-b.atk} DEF+${a.def-b.def} SP+1`);
    levelFx();
  }
  if(S.lv>=MAXLV)S.exp=Math.min(S.exp,needExp(MAXLV)-1);
  return lines;
}

  try{

    if(old)localStorage.setItem(k+'_bak',old);
    localStorage.setItem(k,JSON.stringify({ver:1,t:S.saved,s:S}));

function readSave(sl){
  for(const k of [skey(sl),skey(sl)+'_bak']){
    try{const raw=localStorage.getItem(k);if(!raw)continue;const d=JSON.parse(raw);if(d&&d.s&&JOBS[d.s.job])return d}catch(e){}
  }
  return null;
}
function loadSlot(sl){
  const d=readSave(sl);if(!d)return false;
  S=merge(newState(d.s.name,d.s.job),d.s);sanitize();return true;
}
function newestSlot(){
  let best=null,bt=-1;
  for(const [sl] of SLOTS){const d=readSave(sl);if(d&&(d.t||0)>bt){bt=d.t||0;best=sl}}
  return best;
}

/* ============ 報酬・アイテム・クエスト基盤 ============ */
function giveItem(id,n){
  n=n||1;S.inv[id]=(S.inv[id]||0)+n;S.found[id]=(S.found[id]||0)+n;
  if(S.loc!=='town'){const f=ast().found;f[id]=(f[id]||0)+n}
  if(IT[id].r==='legend')S.flags.legend=true;
}
function giveReward(rw){
  const out=[];
  if(rw.gold){S.gold+=rw.gold;S.st.gold+=rw.gold;out.push(`💰${fmt(rw.gold)}G`)}
  if(rw.exp){out.push(`EXP${fmt(rw.exp)}`);gainExp(rw.exp).forEach(say)}
  if(rw.items)for(const id of Object.keys(rw.items)){giveItem(id,rw.items[id]);out.push(`${iname(id)}×${rw.items[id]}`)}
  return out.join(' ');
}
function ensureDaily(){
  const t=todayStr();if(S.daily.date===t&&S.daily.list.length)return;
  const picks=DAILY_T.slice().sort(()=>Math.random()-.5).slice(0,3);
  S.daily={date:t,list:picks.map(p=>({k:p.k,n:rnd(p.r[0],p.r[1]),p:0,claimed:false}))};
}
function ev(type,key,n){
  n=n||1;ensureDaily();
  for(const id of Object.keys(S.quests.active)){
    const q=QM[id];if(!q||q.ty!==type||q.ty==='collect')continue;
    if(q.tg===undefined||q.tg==='*'||q.tg===key){const a=S.quests.active[id];a.p=Math.min(q.cnt,(a.p||0)+n)}
  }
  for(const d of S.daily.list)if(d.k===type&&!d.claimed)d.p=Math.min(d.n,d.p+n);
}
const qprog=q=>q.ty==='collect'?Math.min(q.cnt,S.inv[q.tg]||0):((S.quests.active[q.id]||{}).p||0);
const dreward=d=>({exp:Math.round(d.n*(10+S.lv*2)),gold:Math.round(d.n*(10+S.lv*3)),items:{potion:1}});
function unlockArea(id){
  if(S.unlocked[id])return;S.unlocked[id]=true;
  toast(`🗺 新エリア解放：${AREAS[id].n}`);say(`🗺 新エリア「${AREAS[id].n}」が解放された！`);banner('NEW AREA!','#6af0ff');sfx('ach');
}
function checkAch(){
  for(const a of ACH){
    if(S.ach[a.id])continue;let ok=false;try{ok=a.t()}catch(e){}
    if(!ok)continue;
    S.ach[a.id]=Date.now();if(!S.titles.includes(a.ti))S.titles.push(a.ti);
    const r=giveReward(a.rw||{});
    toast(`🏆 実績解除：${a.n}<br><span class="hl">称号「${a.ti}」</span>`);sfx('ach');
    say(`🏆実績「${a.n}」解除！称号「${a.ti}」 ${r}`);
  }
}

function npcLines(id){
  const bd=S.bossDone,stage=Object.keys(bd).length,n=NPCS[id].n,cl=S.flags.cleared;
  if(id==='elder'){
    if(cl)return [[n,'おお、英雄よ！魔王…いや、勇者アークの魂は解放されたのだな。町の者も皆、感謝しておる。'],[n,'まだ見ぬ宝が各地に眠っておる。気の向くままに旅を続けるがよい。']];
    return [[n,['よく来てくれた。各地のダンジョンは魔物に封じられ、町は孤立しておる。','森の主を倒したと聞いた。次は洞窟じゃな。あそこには「光る欠片」があるはずじゃ。','古い城に竜が棲みついておる。決して油断するでないぞ。','魔王の城への道が開いたか…。どうか無事で帰ってきておくれ。'][Math.min(stage,3)]],[n,'疲れたら宿屋で休むのじゃぞ。無理は禁物じゃ。']];
  }
  if(id==='child')return [[n,'冒険者さん、「鍛錬の間」って知ってる？メニューの「鍛錬」から、自分の筋トレを記録できるんだって。'],[n,'でもね、やってもやらなくてもいいの。お休みの日だって、冒険だけで強くなれるよ！']];
  if(id==='vet')return [[n,'戦いのコツを教えてやろう。「防御」するとダメージが減って、MPも少し回復する。'],[n,stage<2?'回復薬は多めに持っていけ。ボスは逃げられんぞ。':'ボスは3ターンごとに大技を使ってくる。その前に防御か回復だ！'],[n,'ゴーレムは力を溜めたら次が危険だ。守りの薬も役に立つぞ。']];
  if(id==='scholar'){
    const L=[[n,'古文書を研究しているの。ダンジョンの奥に、世界の秘密が隠されているわ。']];
    if(!S.flags.gift_sch){S.flags.gift_sch=1;L.push([n,'研究の協力のお礼に、魔力の水をあげる。持っていって！']);giveItem('ether',2);autosave()}

const tier=()=>Math.min(3,['forest','cave','castle'].filter(a=>S.bossDone[a]).length);
function owned(id){return S.inv[id]||0}
function equippedCount(id){return ['weapon','armor','acc'].filter(s=>S.eq[s]===id).length}
function shopScreen(kind){
  const isW=kind==='weapon',types=isW?[ui.stab]:['use','mat'];
  let h=`<h2>${isW?'⚔ 武器屋':'🧪 道具屋'}</h2><p class="dim">所持金：<span class="gold">${fmt(S.gold)}G</span>　${isW?'ボスを倒すと品揃えが増える':'薬や強化アイテムを扱っている'}</p>`;
  if(isW)h+=`<div class="tabs">${[['weapon','武器'],['armor','防具'],['acc','装飾']].map(x=>btn(x[1],'stab',x[0],ui.stab===x[0]?'on':'')).join('')}</div>`;
  h+=`<div class="tabs">${btn('買う','smode','buy',ui.mode==='buy'?'on':'')}${btn('売る','smode','sell',ui.mode==='sell'?'on':'')}</div>${logBox()}`;
  if(ui.mode==='buy'){
    const list=Object.values(IT).filter(i=>types.includes(i.t)&&i.shop!==undefined&&i.shop<=tier()).sort((a,b)=>a.price-b.price);
    h+=list.map(i=>{
      const can=S.gold>=i.price;let extra='';
      if(i.t!=='use'&&i.t!=='mat'){const cur=IT[S.eq[i.t==='weapon'?'weapon':i.t==='armor'?'armor':'acc']];const k=i.t==='weapon'?'atk':'def';if(i.t!=='acc'){const d=(i[k]||0)-((cur&&cur[k])||0);extra=` <span class="${d>=0?'ok':'ng'}">(${d>=0?'+':''}${d})</span>`}}
      return `<div class="item"><div class="l">${iname(i.id)}<span class="tag ${i.r}">${RAR[i.r].n}</span>${extra}<br><span class="dim">${statTxt(i)} ／ 所持${owned(i.id)}</span></div><div class="r"><span class="gold">${fmt(i.price)}G</span>${btn('買う','buy',i.id,'sm',!can)}${i.t==='use'?btn('×5','buy',i.id+'|5','sm',S.gold<i.price*5):''}${(i.t==='weapon'||i.t==='armor'||i.t==='acc')&&owned(i.id)>0&&S.eq[i.t]!==i.id?btn('装備','equip',i.id,'sm'):''}</div></div>`}).join('')||'<p class="dim">商品がありません。</p>';
  }else{
    const ids=Object.keys(S.inv).filter(id=>types.includes(IT[id].t)||(!isW&&false));
    const list=ids.map(id=>({i:IT[id],n:S.inv[id]-equippedCount(id)})).filter(x=>x.n>0).sort((a,b)=>a.i.price-b.i.price);
    h+=list.map(x=>`<div class="item"><div class="l">${iname(x.i.id)}<span class="tag ${x.i.r}">${RAR[x.i.r].n}</span><br><span class="dim">${statTxt(x.i)||x.i.desc||''} ／ 売れる数${x.n}</span></div><div class="r"><span class="gold">${fmt(SELL(x.i))}G</span>${btn('売る','sell',x.i.id,'sm')}${x.n>1?btn('全部','sell',x.i.id+'|'+x.n,'sm'):''}</div></div>`).join('')||'<p class="dim">売れるものがありません。(装備中のものは売れません)</p>';
  }
  h+=`<div class="col">${btn('町へ戻る','home')}</div>`;
  panel.innerHTML=h;
}
SCR.weapon=()=>shopScreen('weapon');SCR.item=()=>shopScreen('item');

ACT.smode=m=>{ui.mode=m;ui.log=[];render()};
ACT.buy=a=>{
  const [id,ns]=a.split('|'),n=+ns||1,it=IT[id];
  if(!it||S.gold<it.price*n){sfx('err');return}
  S.gold-=it.price*n;giveItem(id,n);sfx('gold');ui.log=[];say(`${iname(id)}を${n>1?n+'個':''}購入した。(-${fmt(it.price*n)}G)`);autosave();render();
};
ACT.sell=a=>{
  const [id,ns]=a.split('|'),it=IT[id];let n=+ns||1;
  n=Math.min(n,(S.inv[id]||0)-equippedCount(id));if(n<=0){sfx('err');return}
  S.inv[id]-=n;if(S.inv[id]<=0)delete S.inv[id];S.gold+=SELL(it)*n;S.st.gold+=SELL(it)*n;sfx('gold');ui.log=[];say(`${iname(id)}を${n}個売った。(+${fmt(SELL(it)*n)}G)`);autosave();render();
};

ACT.buyore=()=>{if(S.gold<80)return sfx('err');S.gold-=80;giveItem('ore',1);sfx('gold');ui.log=[];say('鉱石を1個買った。');render()};
ACT.enh=id=>{
  const it=IT[id],e=S.enh[id]||0,c=enhCost(it);

function lowHpWarn(){const st=stats();return S.hp<st.hp*.3}
ACT.explore=()=>{
  const a=AREAS[S.loc],s=ast();
  S.st.explores++;s.ex++;ev('explore');sfx('step');ui.log=[];
  const prev=S.prog[S.loc]||0;S.prog[S.loc]=Math.min(a.need,prev+1);
  const st=stats();S.mp=Math.min(st.mp,S.mp+1);
  if(prev<a.need&&S.prog[S.loc]>=a.need){
    ev('depth',S.loc);
    const l=a.lore.find(x=>!S.lore[x]);
    say('✨ 最深部への道が開けた！');
    if(l){S.lore[l]=1;say('📜 最深部の碑文を発見した…(古文書に追加)')}
    say('<span class="hl">最奥のボスに挑めるようになった。</span>');
    sfx('ach');checkAch();autosave();render();return;
  }
  const r=Math.random();
  if(r<.42){const [mid,,sc]=wpick(a.mon);return startBattle(mid,sc||1,pick(a.flav))}
  else if(r<.56)openChest();
  else if(r<.66){const id=pick(S.loc==='forest'?['herb','herb','potion']:['potion','potion','hipotion','ether']);giveItem(id,1);say(`🎒 道端で ${iname(id)} を拾った。`);sfx('chest')}
  else if(r<.72){
    const pool=a.loot.c.concat(a.loot.r).filter(i=>IT[i].t==='weapon'||IT[i].t==='armor'||IT[i].t==='acc');
    if(pool.length){const id=pick(pool);giveItem(id,1);say(`⚔ 朽ちた荷物の中から ${iname(id)} を見つけた！`);sfx('chest')}else{const gld=rnd(a.gold[0],a.gold[1]);S.gold+=gld;say(`💰 ${gld}G を拾った。`)}
  }
  else if(r<.79){const h=Math.floor(st.hp*.3),m=Math.floor(st.mp*.3);S.hp=Math.min(st.hp,S.hp+h);S.mp=Math.min(st.mp,S.mp+m);sfx('heal');say(`💧 清らかな泉を見つけた。HP+${h} MP+${m}`)}
  else if(r<.84){const dm=Math.min(S.hp-1,Math.max(1,Math.floor(st.hp*.06)));S.hp-=dm;sfx('hurt');say(`⚠ 罠にかかってしまった！ ${dm}のダメージ。(HPは1以下にならない)`)}
  else if(r<.9){
    const l=a.lore.find(x=>!S.lore[x]);
    if(l){S.lore[l]=1;say('📜 古い碑文を見つけた…！古文書に追加された。');sfx('ach')}
    else{const xp=Math.round(5+S.lv*2);say(`📖 古い記録を読み返した。(EXP+${xp})`);gainExp(xp).forEach(say)}
  }
  else if(r<.95){const g=rnd(a.gold[0],a.gold[1]);S.gold+=g;S.st.gold+=g;sfx('gold');say(`💰 落ちていた袋に ${g}G が入っていた。`)}
  else{say('旅の商人とすれ違った。「また会いましょう」と薬をくれた。');giveItem('potion',1);sfx('chest')}
  if(a.extra&&Math.random()<a.extra[1]*(1+stats().luck*.3)&&r>=.42){giveItem(a.extra[0],1);say(`✦ ${iname(a.extra[0])} を見つけた。`)}
  checkAch();autosave();render();
};
function openChest(){
  const a=AREAS[S.loc],L=a.loot,lk=stats().luck,r=Math.random();
  const lg=L.l.length?.006*(1+lk*.6):0,ep=L.e.length?.03*(1+lk*.5):0,ra=.16*(1+lk*.35);
  let pool,rar='common';
  if(r<lg){pool=L.l;rar='legend'}else if(r<lg+ep){pool=L.e;rar='epic'}else if(r<lg+ep+ra){pool=L.r;rar='rare'}else pool=L.c;
  const id=pick(pool),n=IT[id].t==='use'&&IT[id].r==='common'?rnd(1,2):1,gold=rnd(a.gold[0],a.gold[1]);
  S.gold+=gold;S.st.gold+=gold;giveItem(id,n);S.st.chests++;ast().ch++;ev('chest');
  sfx('chest');
  if(rar!=='common'){toast(`✨ ${RAR[rar].n}を発見！ ${iname(id)}`);banner(rar==='legend'?'LEGEND!':'RARE!',rar==='legend'?'#ffb53a':'#b46bff')}
  say(`📦 宝箱を開けた！ ${iname(id)}${n>1?'×'+n:''} と ${gold}G を手に入れた${rar!=='common'?' ✨':''}`);
}

const calcDmg=(A,D,pierce)=>Math.max(1,Math.round(A*A/(A+D*(1-(pierce||0)))*(.9+Math.random()*.2)));
function startBattle(mid,sc,intro){
  sc=sc||1;const m=MON[mid],k=Math.pow(sc,.8);
  const e={id:mid,n:m.n,hp:Math.round(m.hp*sc),atk:Math.round(m.atk*k),def:Math.round(m.def*k),exp:Math.round(m.exp*sc),gold:Math.round(m.gold*sc),boss:!!m.boss,tr:m.tr};
  e.max=e.hp;
  B={id:++bid,e,turn:1,defend:false,buf:{atk:0,def:0},busy:false,poison:0,charge:false,eturn:0,over:false,phit:0,ehit:0,eshake:0};
  S.st.battles++;const d=S.dex[mid]||(S.dex[mid]={s:0,k:0});d.s++;
  ui.log=[];if(intro)say(intro);
  say(m.boss?`<span class="ng">${m.n}が立ちはだかる！</span>`:`${m.n}が現れた！`);
  if(m.boss){sfx('boss');banner('BOSS BATTLE','#ff6a6a');flash('rgba(255,0,0,.4)');shake()}
  checkAch();setScr('battle');
}

function playerHit(A,pierce,fx,name){
  const e=B.e;
  if(e.tr==='evade'&&Math.random()<.2){say(`${name}！ しかし${e.n}にかわされた！`);pop('MISS','t','e');sfx('click');return afterPlayer()}
  const crit=Math.random()<.08+stats().luck*.02,dmg=calcDmg(A*(crit?1.6:1),e.def,pierce);
  e.hp=Math.max(0,e.hp-dmg);B.ehit=4;B.eshake=6;
  fxAdd(fx,'e');sfx(crit?'crit':(fx==='fire'||fx==='bolt'?'magic':'hit'));
  pop(dmg,crit?'c':'d','e');say(`${name}！ ${e.n}に<b>${dmg}</b>のダメージ${crit?' <span class="hl">会心！</span>':''}`);
  afterPlayer();
}

ACT.skill=id=>pAct(()=>{

  if(!k||!S.skills[id]||S.mp<k.mp){B.busy=false;sfx('err');return render()}
  S.mp-=k.mp;S.st.skillUses++;ev('skill');updateHud();

  else{

    if(k.cure)B.poison=0;fxAdd('heal','p');sfx('heal');pop('+'+(S.hp-before),'h','p');say(`${k.n}！ HPが${S.hp-before}回復した${k.cure?'(毒も治った)':''}`);updateHud();afterPlayer();
  }

function applyItem(id,inB){
  const it=IT[id],st=stats();if(!S.inv[id])return null;let msg=null;
  if(it.heal){
    if(S.hp>=st.hp&&!(it.mpFull&&S.mp<st.mp))return null;
    const b=S.hp;S.hp=Math.min(st.hp,S.hp+it.heal);if(it.mpFull)S.mp=st.mp;msg=`HPが${S.hp-b}回復した`;if(inB)pop('+'+(S.hp-b),'h','p');ev('item');sfx('heal');
  }else if(it.mp){
    if(S.mp>=st.mp)return null;const b=S.mp;S.mp=Math.min(st.mp,S.mp+it.mp);msg=`MPが${S.mp-b}回復した`;ev('item');sfx('heal');
  }else if(it.cure){if(!inB||!B.poison)return null;B.poison=0;msg='毒が消えた';sfx('heal')}

function afterPlayer2(){render();later(enemyTurn,700)}
function enemyTurn(){
  if(!B||B.over)return;
  const e=B.e,m=MON[e.id];B.eturn++;
  let plan={mult:1,n:1,label:`${e.n}の攻撃`},sp=null;
  if(e.boss){
    if(m.sp2&&e.hp<e.max/2&&B.eturn%m.sp2.e===0)sp=m.sp2;else if(m.sp&&B.eturn%m.sp.e===0)sp=m.sp;
  }
  if(sp){plan={mult:sp.m,n:1,label:`<span class="ng">${sp.n}</span>`,sp}}
  else if(e.tr==='heavy'){
    if(B.charge){B.charge=false;plan={mult:2.2,n:1,label:`${e.n}の渾身の一撃`}}
    else if(Math.random()<.3){B.charge=true;say(`${e.n}は力を溜めている…！`);return endEnemyTurn()}
  }else if(e.tr==='double'&&Math.random()<.3)plan.n=2;
  if(plan.sp){banner('⚠ '+plan.sp.n,plan.sp.col);fxAdd('breath','p',plan.sp.col,700);flash(plan.sp.col+'99');shake();sfx('boss');render();later(()=>doHits(plan),600)}
  else doHits(plan);
}
function doHits(plan){
  const e=B.e,st=stats();
  for(let i=0;i<plan.n;i++){
    const D=st.def*(B.buf.def>0?1.4:1);
    let dmg=calcDmg(e.atk*plan.mult,D,0);
    if(B.defend)dmg=Math.max(1,Math.round(dmg*(1-JOBS[S.job].red)));
    S.hp=Math.max(0,S.hp-dmg);B.phit=4;fxAdd('hit','p');if(!plan.sp)sfx('hurt');
    pop(dmg,'x','p');say(`${plan.label}${plan.n>1?`(${i+1}回目)`:''}！ <b>${dmg}</b>のダメージを受けた${B.defend?'(防御)':''}`);
    if(e.tr==='drain'){const h=Math.round(dmg*.5);e.hp=Math.min(e.max,e.hp+h);say(`${e.n}はHPを${h}吸収した！`)}
    if(e.tr==='poison'&&!B.poison&&Math.random()<.4){B.poison=3;say('<span class="ng">☠ 毒を受けた！</span>')}
    if(S.hp<=0)break;
  }
  updateHud();
  if(S.hp<=0){render();return later(defeat,700)}
  endEnemyTurn();
}
function endEnemyTurn(){
  if(B.poison>0){
    const st=stats(),dm=Math.max(1,Math.floor(st.hp*.04));S.hp=Math.max(0,S.hp-dm);B.poison--;pop(dm,'x','p');say(`☠ 毒のダメージ ${dm}`);
    if(S.hp<=0){updateHud();render();return later(defeat,700)}
  }
  B.turn++;B.defend=false;B.buf.atk=Math.max(0,B.buf.atk-1);B.buf.def=Math.max(0,B.buf.def-1);
  const st=stats();S.mp=Math.min(st.mp,S.mp+1);B.busy=false;updateHud();render();
}
const FIRST={goblinking:{silver_blade:1},guardian:{mithril:1,frag:3},dragon:{dragon_fang:1,scale:1},demon:{emblem:1,elixir:2}};
function victory(){
  B.over=true;const e=B.e,m=MON[e.id];ui.log=[];
  S.st.kills++;S.dex[e.id].k++;ev('kill',e.id);
  say(`🎉 ${e.n}を倒した！`);

  gainExp(e.exp).forEach(say);
  const dr=m.drop;if(dr&&Math.random()<dr[1]*(1+stats().luck*.2)){giveItem(dr[0],1);say(`🎁 ${iname(dr[0])} を落とした！`)}

  ui.res={t:'VICTORY!',c:'hl'};ui.next='home';
  if(e.boss){
    S.st.bosses++;ev('boss',e.id);const first=!S.bossDone[S.loc];S.bossDone[S.loc]=true;
    const l=BOSS_LORE[e.id];if(l&&!S.lore[l]){S.lore[l]=1;say('📜 古文書に新たな記述が加わった。')}
    if(first){const f=FIRST[e.id]||{};for(const id of Object.keys(f)){giveItem(id,f[id]);say(`🌟 ボス撃破報酬：${iname(id)}×${f[id]}`)}}
    else if(m.drop&&Math.random()<.5){giveItem(m.drop[0],1);say(`🎁 ${iname(m.drop[0])} を落とした！`)}
    const nx=NEXTA[S.loc];if(nx)unlockArea(nx);

}
function defeat(){

function readTrainForm(){
  const ex=$('#t_ex').value,reps=Math.floor(+$('#t_reps').value),sets=Math.floor(+$('#t_sets').value);
  let kg=+$('#t_kg').value||0;const note=$('#t_note').value.trim().slice(0,40);
  const maxR=ex==='plank'?900:300;
  if(!EX[ex]||!(reps>=1&&reps<=maxR)||!(sets>=1&&sets<=30)||kg<0||kg>200){ui.log=[];say(`<span class="ng">入力を確認してください(回数1〜${maxR}、セット1〜30)。</span>`);sfx('err');render();return null}
  if(!EX[ex].w)kg=0;
  return {ex,reps,sets,kg,note};
}
const rawXp=(ex,reps,sets)=>Math.max(1,Math.round(EX[ex].f*reps*sets));
ACT.tadd=()=>{
  const f=readTrainForm();if(!f)return;
  const d=todayStr(),raw=rawXp(f.ex,f.reps,f.sets),used=S.tclaim[d]||0,xp=Math.max(0,Math.min(raw,TCAP-used));
  S.tclaim[d]=used+xp;
  S.train.unshift(Object.assign({id:Date.now()+'_'+rnd(0,999),d,raw,xp},f));if(S.train.length>300)S.train.length=300;
  ui.log=[];sfx('heal');say(`💪 記録しました：${EX[f.ex].n} ${f.reps}${EX[f.ex].u}×${f.sets}`);
  if(xp>0){say(`冒険の経験値 +${xp}`);gainExp(xp).forEach(say)}
  else say('今日の経験値の上限に達しています。記録だけ残りました。無理せず休みましょう。');
  if((S.train.filter(r=>r.d===d).reduce((s,r)=>s+r.sets,0))>=15)say('<span class="hl">今日はたくさん頑張りました。ゆっくり休んでね。</span>');
  checkAch();autosave();render();
};
ACT.tedit=id=>{ui.tedit=id;ui.log=[];render();window.scrollTo(0,0)};
ACT.tcancel=()=>{ui.tedit=null;ui.log=[];render()};
ACT.tsave=()=>{
  const r=S.train.find(x=>x.id===ui.tedit);if(!r){ui.tedit=null;return render()}
  const f=readTrainForm();if(!f)return;
  const raw=rawXp(f.ex,f.reps,f.sets);let extra=0;
  if(raw>r.raw){extra=Math.max(0,Math.min(raw-r.raw,TCAP-(S.tclaim[r.d]||0)));S.tclaim[r.d]=(S.tclaim[r.d]||0)+extra;r.xp+=extra}
  r.raw=raw;Object.assign(r,f);ui.tedit=null;ui.log=[];sfx('click');say('記録を修正しました。');
  if(extra>0){say(`増えた分の経験値 +${extra}`);gainExp(extra).forEach(say)}
  say('<span class="dim">※修正で経験値が減ることはありません。</span>');
  autosave();render();
};
ACT.tdel=id=>confirmBox('この記録を削除しますか？(獲得済みの経験値は減りません)',()=>{S.train=S.train.filter(r=>r.id!==id);if(ui.tedit===id)ui.tedit=null;ui.log=[];say('記録を削除しました。');autosave();render()},'削除する');
ACT.trest=()=>{
  const d=todayStr();if(S.rest[d])return sfx('err');
  S.rest[d]=true;ui.log=[];sfx('heal');say('🌙 今日は休息日。しっかり休むのも大切な冒険です。(EXP+15)');gainExp(15).forEach(say);
  const st=stats();S.hp=Math.min(st.hp,S.hp+Math.floor(st.hp*.2));checkAch();autosave();render();
};

/* ============ セーブ・設定 ============ */
function slotInfo(sl){
  const d=readSave(sl);if(!d)return '<span class="dim">データなし</span>';
  const s=d.s,dt=new Date(d.t||0);
  return `${esc(s.name)} Lv${s.lv} ${JOBS[s.job].n}<br><span class="dim">${AREAS[s.loc]?AREAS[s.loc].n:'町'} ／ ${fmt(s.gold)}G ／ ${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}</span>`;
}
SCR.save=()=>{
  const ok=storeOK();
  panel.innerHTML=`<h2>💾 ${ui.fromTitle?'ロード':'セーブ / ロード'}</h2><p class="dim">進行状況はブラウザ(localStorage)に保存されます。重要な場面では自動セーブされます。</p>
  ${ok?'':'<p class="ng">⚠ このブラウザでは保存できません。</p>'}${logBox()}`+
  SLOTS.map(([sl,nm])=>`<div class="item"><div class="l"><b>${nm}</b><br>${slotInfo(sl)}</div><div class="r">${!ui.fromTitle&&sl!=='auto'?btn('セーブ','save',sl,'sm',!ok):''}${btn('ロード','load',sl,'sm',!readSave(sl))}</div></div>`).join('')+
  `<div class="col">${ui.fromTitle?btn('タイトルへ','totitle'):btn('戻る','home')}</div>`;
};
ACT.save=sl=>{ui.log=[];if(writeSave(sl)){sfx('heal');say(`${SLOTS.find(x=>x[0]===sl)[1]}にセーブしました。`)}else{sfx('err');say('<span class="ng">セーブに失敗しました(保存領域を確認してください)。</span>')}render()};
ACT.load=sl=>{
  const run=()=>{if(loadSlot(sl)){ui.fromTitle=false;sfx('heal');afterLoad()}else{sfx('err');ui.log=[];say('<span class="ng">ロードに失敗しました。</span>');render()}};
  if(ui.fromTitle)run();else confirmBox('現在の進行状況は失われます(未セーブ分)。ロードしますか？',run,'ロード');
};
SCR.settings=()=>{
  panel.innerHTML=`<h2>⚙ 設定</h2><div class="box"><label>全体音量 <b id="vm">${Math.round(SET.m*100)}</b>%</label><input id="v_m" type="range" min="0" max="100" value="${Math.round(SET.m*100)}">
  <label>BGM音量 <b id="vb">${Math.round(SET.b*100)}</b>%</label><input id="v_b" type="range" min="0" max="100" value="${Math.round(SET.b*100)}">
  <label>効果音音量 <b id="vs">${Math.round(SET.s*100)}</b>%</label><input id="v_s" type="range" min="0" max="100" value="${Math.round(SET.s*100)}">
  <label><input id="v_mute" type="checkbox"${SET.mute?' checked':''}> ミュート(すべての音を消す)</label>
  <label><input id="v_calm" type="checkbox"${SET.calm?' checked':''}> 画面の揺れ・フラッシュを減らす</label></div>
  <div class="grid2">${btn('効果音テスト','sndtest')}${btn('タイトルへ','totitle2')}</div>
  <h3>データ管理</h3><p class="dim">全データを削除するとセーブも消えます。</p>${btn('すべてのデータを削除','wipe','','atk')}<div class="col">${btn('戻る','home')}</div>`;
};
ACT.sndtest=()=>{Snd.init();sfx('levelup')};
ACT.totitle2=()=>{autosave();B=null;setScr('title')};
ACT.wipe=()=>confirmBox('すべてのセーブデータを削除します。元に戻せません。本当によろしいですか？',()=>{
  try{Object.keys(localStorage).filter(k=>k.startsWith('tq_save_')).forEach(k=>localStorage.removeItem(k))}catch(e){}
  S=null;B=null;ui.log=[];toast('データを削除しました');setScr('title');
},'削除する');

/* ============ 入力・起動 ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  Snd.init();Snd.resume();
  const f=ACT[t.dataset.a];
  if(!f)return;
  if(!['atk','def','skill','bitem','flee','mok','mcancel'].includes(t.dataset.a))sfx('click');
  try{f(t.dataset.g)}catch(err){console.error(err);toast('エラーが発生しました')}
});
document.addEventListener('input',e=>{
  const id=e.target.id;if(!id||!id.startsWith('v_'))return;
  if(id==='v_m'||id==='v_b'||id==='v_s'){
    const v=(+e.target.value)/100,k=id.slice(2);SET[k]=v;$('#v'+k).textContent=Math.round(v*100);
  }else if(id==='v_mute')SET.mute=e.target.checked;
  else if(id==='v_calm')SET.calm=e.target.checked;
  Snd.init();Snd.apply();saveSet();
});
document.addEventListener('change',e=>{if(e.target.id==='v_m'||e.target.id==='v_b'||e.target.id==='v_s')sfx('click')});
window.addEventListener('beforeunload',()=>{try{if(S&&B===null)autosave()}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!B)autosave()});
loadSet();
render();
requestAnimationFrame(loop);
</script>
</body>
</html>
